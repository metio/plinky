<svg style="width:100%;height:100%;display:block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
<!-- Plinky's mark: the lowercase p of Literata, the face the app sets every title in,
     with the counter of its bowl inked pink. A note whose stem points down is a head with
     the stem descending from its left — the same silhouette as the letter — so the initial
     of the name and a notehead are one shape, and the pink lands where the typeface
     already left a hole.

     The outline is a derivative of Literata (SIL Open Font License 1.1), cut at weight 700
     and optical size 7 — the small-text cut, whose sturdier serifs and more generous
     counter are what survive a 16-pixel favicon.

     The letter sits inside the maskable safe zone (the middle 80%), so a launcher may round
     or crop the square without eating it. Everything else — the PNG renders, the favicon,
     the brand kit — is generated from this file by `npm run icons` and `npm run brand`. -->
