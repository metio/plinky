name: Help Pictures
# The pictures on the help page, retaken from main and committed back to it.
#
# public/help holds ten screenshots in each of twenty-six languages, taken from a real
# build by dev/help-screenshots.mjs. Before this they were taken when somebody remembered
# to, which is why they spent months showing a navigation bar and a colour scheme the app
# had stopped having. Nobody has to remember now: every push to main that could have moved
# them retakes them, and a picture that came out different is committed straight back.
#
# Straight to main rather than through a pull request: a retaken screenshot has nothing
# for a reviewer to decide. It is either what the app looks like or the app changed again,
# and the next push settles that either way.
on:
  push:
    branches: [main]
    # The two paths this workflow itself writes. Nothing else touches them, so a push that
    # changes only these is this workflow's own commit coming back round — and a run
    # started by it would take the same pictures again forever. GitHub does not raise
    # workflow events for a push made with the built-in GITHUB_TOKEN, which is the first
    # guard and the reason there is no personal access token here; this is the second, and
    # the one that holds whatever the token does.
    #
    # An ignore-list rather than an allow-list, deliberately. What moves these pictures is
    # every string, every component, every colour and the catalogue they list — naming
    # that set is naming most of the repository, and anything left out is a UI change that
    # ships with pictures of the app before it. Publish Website made the same argument
    # against its own path filter and dropped it.
    paths-ignore:
      - public/help/**
      - dev/help-shots.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One run at a time, and the newest wins: these are pictures of main's tip, so a run
  # overtaken by another push is taking pictures of something that is already history.
  # Nothing is committed until the end, so a cancelled run leaves the tree untouched.
  group: help-shots
  cancel-in-progress: true
jobs:
  shots:
    name: shots
    runs-on: ubuntu-latest
    # An all-locales build plus two hundred and sixty page loads through a browser. It has
    # taken nothing like this long, but a hung browser would otherwise sit on a runner for
    # the default six hours.
    timeout-minutes: 120
    permissions:
      # To commit the retaken pictures back to main.
      contents: write
      # To ask Publish Website to run afterwards; see that step.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@d0c25fdb0d2c08f23bc62c867317a266b6f1a5c1 # 2026.9.12204255
      - run: nix develop --command npm ci
      - name: Take the pictures
        # The wrapper builds every language first, because that is the one tree these
        # pictures can be taken from. It reshoots only the languages whose words or whose
        # app have changed, and prints which.
        run: nix develop --command ci-help-shots
      - name: Commit the ones that changed
        id: commit
        run: |
          # Only a changed PICTURE is worth a commit. dev/help-shots.json records what each
          # language was last photographed against, and it moves on any build whose asset
          # names moved — so committing it alone would put an empty-looking commit on main
          # after most pushes. Left uncommitted it is simply derived again next time.
          if [ -z "$(git status --porcelain -- public/help)" ]; then
            echo "The pictures already match the app."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/help dev/help-shots.json
          git commit --signoff \
            -m "chore(help): the help pictures show the app as it is" \
            -m "Retaken from $GITHUB_SHA by .github/workflows/help-shots.yml."
          # main may have moved while the browser was working. Replaying onto it is safe:
          # nothing else writes these files, so there is nothing to conflict with.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the new pictures
        # A push made with GITHUB_TOKEN raises no workflow events, so the commit above does
        # not deploy itself and the site would go on serving the old pictures until some
        # later, unrelated push. A dispatch is the one event GITHUB_TOKEN may raise, and
        # Publish Website deploys main's tip, which now carries them.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run website.yml --ref main
