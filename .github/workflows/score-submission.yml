name: Score submission
on:
  issues:
    types: [opened, edited]
# One run per issue: a quick second edit would otherwise run beside the first, each
# posting its own check comment, and the older verdict could be written last.
concurrency:
  group: score-submission-${{ github.event.issue.number }}
  cancel-in-progress: true
# The issue body is untrusted: anyone can open an issue, and one opened through the API
# or edited afterwards can hold anything in any section. So the job that reads and
# renders it holds a read-only token and leaves none in the checkout, and only the job
# that comments can write to issues — it runs no code from the body, and reads the
# verdict and report from its environment rather than having them pasted into its
# script by a `${{ }}` expansion.
permissions: {}
jobs:
  check:
    name: check
    # Only act on score submissions; the issue form prefixes the title.
    if: startsWith(github.event.issue.title, '[Score] ')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
      report: ${{ steps.validate.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        # No dependency cache: this job runs for anyone's issue, and a cache saved from
        # it would be restorable by the default branch's other workflows.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate the submitted MusicXML
        id: validate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/validate-submission.mjs
  comment:
    name: comment
    needs: check
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment and label
        # Renovate pins this to a commit digest.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VALID: ${{ needs.check.outputs.valid }}
          REPORT: ${{ needs.check.outputs.report }}
        with:
          script: |
            const valid = process.env.VALID === "true";
            const marker = "<!-- plinky-score-check -->";
            const message = [
              marker,
              JSON.parse(process.env.REPORT),
              "",
              "_Automated check — edit the issue to run it again._",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Upsert the bot's check comment so editing the issue does not pile up comments.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: message });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: message });
            }

            // Reflect the verdict in labels, creating them if they do not exist yet.
            const ensureLabel = async (name, color) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch {
                await github.rest.issues.createLabel({ owner, repo, name, color });
              }
            };
            await ensureLabel("submission-valid", "0e8a16");
            await ensureLabel("submission-needs-changes", "fbca04");

            const add = valid ? "submission-valid" : "submission-needs-changes";
            const drop = valid ? "submission-needs-changes" : "submission-valid";
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [add] });
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: drop });
            } catch {
              // The label was not set; nothing to remove.
            }
