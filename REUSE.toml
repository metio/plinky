# SPDX-License-Identifier: AGPL-3.0-or-later

version = 1

# JSON carries no comment syntax, so these files get their declaration here
# rather than inline.
[[annotations]]
path = ["package.json", "package-lock.json", "tsconfig.json", "renovate.json", "biome.json", "knip.json", "lighthouserc.json", "public/manifest.webmanifest", "messages/*.json", "project.inlang/settings.json"]
precedence = "override"
SPDX-FileCopyrightText = "The Plinky Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# flake.lock is nix-generated JSON; it pins the toolchain both CI and local
# shells resolve from flake.nix.
[[annotations]]
path = "flake.lock"
precedence = "override"
SPDX-FileCopyrightText = "The Plinky Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Catalog scores (MusicXML) are transcriptions/arrangements of public-domain or
# non-copyrightable music, dedicated to the public domain (CC0). Each is its own
# file so its license is tracked individually.
[[annotations]]
path = ["scores/*.musicxml"]
precedence = "override"
SPDX-FileCopyrightText = "The Plinky Authors"
SPDX-License-Identifier = "CC0-1.0"

# The curated song catalogue: scores harvested from several public-domain sources (PDMX,
# OpenScore Lieder, KernScores, Mutopia, ASAP, DCMLab, CPDL), stored as compressed .mxl.
# Each id is a content fingerprint that carries no licence, so the files are grouped into a
# subdirectory per SPDX licence and annotated one glob each. The per-piece source and
# editor credit shown to users comes from the manifest (core/attribution.ts), not here.
[[annotations]]
path = ["public/songs/cc0-1.0/*.mxl"]
precedence = "override"
SPDX-FileCopyrightText = "The catalogue score contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["public/songs/cc-by-4.0/*.mxl"]
precedence = "override"
SPDX-FileCopyrightText = "The catalogue score contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["public/songs/cc-by-3.0/*.mxl"]
precedence = "override"
SPDX-FileCopyrightText = "The catalogue score contributors"
SPDX-License-Identifier = "CC-BY-3.0"

[[annotations]]
path = ["public/songs/cc-by-2.5/*.mxl"]
precedence = "override"
SPDX-FileCopyrightText = "The catalogue score contributors"
SPDX-License-Identifier = "CC-BY-2.5"

[[annotations]]
path = ["public/songs/cc-by-sa-4.0/*.mxl"]
precedence = "override"
SPDX-FileCopyrightText = "The catalogue score contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["public/songs/cc-by-sa-3.0/*.mxl"]
precedence = "override"
SPDX-FileCopyrightText = "The catalogue score contributors"
SPDX-License-Identifier = "CC-BY-SA-3.0"

[[annotations]]
path = ["public/songs/cc-by-sa-2.5/*.mxl"]
precedence = "override"
SPDX-FileCopyrightText = "The catalogue score contributors"
SPDX-License-Identifier = "CC-BY-SA-2.5"

[[annotations]]
path = ["dev/catalog-curation.json", "dev/catalog-duplicates.json"]
precedence = "override"
SPDX-FileCopyrightText = "The Plinky Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["public/songs/manifest.json"]
precedence = "override"
SPDX-FileCopyrightText = "The Plinky Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The same manifest cut into slices, so opening one piece reads about ten kilobytes
# instead of six hundred. Written by `npm run songs:bake` from the manifest above.
[[annotations]]
path = ["public/songs/index/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "The Plinky Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The finger-exercise catalogue. Scales/arpeggios are generated client-side (no
# shipped files); the metadata manifest plus the curated studies are stored — the
# latter public-domain études (Hanon, Czerny, Burgmüller, …) sourced from PDMX (CC0),
# one compressed .mxl each.
[[annotations]]
path = ["public/exercises/manifest.json"]
precedence = "override"
SPDX-FileCopyrightText = "The Plinky Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["public/exercises/studies/*.mxl"]
precedence = "override"
SPDX-FileCopyrightText = "PDMX contributors"
SPDX-License-Identifier = "CC0-1.0"

# Generated logo art, the app-icon renders, the binary favicon, the social-card
# image, and the founder portraits on the About page: declared here so the asset
# files stay untouched.
[[annotations]]
path = ["dev/help-shots.json"]
precedence = "override"
SPDX-FileCopyrightText = "The Plinky Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["public/favicon.ico", "public/*.svg", "public/og.png", "public/icon-*.png", "public/founder-*.webp", "public/help/*/*.webp"]
precedence = "override"
SPDX-FileCopyrightText = "The Plinky Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The brand kit: every file in it is rendered by dev/build-brand.mjs from the app's own
# tokens and the icon, so they are our own art and carry the project's licence. The
# JSON and the images cannot hold a comment; the README does and is left alone.
#
# Three exceptions are not rendered by that script: brand/source/plinky-mark.png is the mark
# as its author supplied it, brand/plinky-mark.png is that file with its background keyed
# out, and brand/plinky-icon.png is the same mark with its wordmark removed — the last two
# both written by dev/key-mark.mjs. All three are ours and carry the same licence.
[[annotations]]
path = ["brand/**/*.png", "brand/**/*.svg", "brand/palette.json"]
precedence = "override"
SPDX-FileCopyrightText = "The Plinky Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The design-sync settings: our own configuration for the component sync, in a format that
# holds no comment.
[[annotations]]
path = [".design-sync/config.json", ".design-sync/tsconfig.types.json"]
precedence = "override"
SPDX-FileCopyrightText = "The Plinky Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Story screenshot baselines: rendered from our own components by the visual
# regression suite (vitest toMatchScreenshot over the Storybook stories).
[[annotations]]
path = ["app/**/__story-shots__/**/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "The Plinky Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
