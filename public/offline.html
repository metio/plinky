<!--
The page the service worker answers with when there is no network and the page asked for
was never opened on this device. It renders from nothing but itself: no chunk, no font, no
stylesheet, because none of those can be fetched either. The copy for every language is
stamped into COPY at build time (dev/stamp-sw.mjs) from the message catalogue, and the
language is read off the URL, which the worker leaves as it was.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Plinky</title>
<style>
    :root {
        color-scheme: light dark;
        --surface: #faf7f2;
        --ink: #241c12;
        --body: #4d4032;
        --line: #e8e0d4;
        --accent: #4915d2;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --surface: #15120e;
            --ink: #f8f4ec;
            --body: #d5cdbf;
            --line: #2e2820;
            --accent: #7c3aed;
        }
    }
    html { background: var(--surface); color: var(--body); }
    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
    }
    main { max-width: 32rem; padding: 2rem 1.5rem; }
    h1 { color: var(--ink); font-size: 1.75rem; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 0.75rem; }
    p { margin: 0 0 1.5rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    button, a {
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 500;
        border-radius: 0.375rem;
        padding: 0.5rem 1rem;
        text-decoration: none;
        cursor: pointer;
    }
    button { background: var(--accent); color: #fff; border: 0; }
    a { border: 1px solid var(--line); color: var(--body); }
</style>
</head>
<body>
<main>
    <h1 id="title"></h1>
    <p id="body"></p>
    <div class="actions">
        <button type="button" id="retry"></button>
        <a id="home" href="/"></a>
    </div>
</main>
<script>
    const COPY = __OFFLINE_COPY__;
    const first = location.pathname.split("/")[1] || "";
    const locale = Object.hasOwn(COPY, first) ? first : "en";
    const copy = COPY[locale];
    document.documentElement.lang = locale;
    document.getElementById("title").textContent = copy.title;
    document.getElementById("body").textContent = copy.body;
    document.getElementById("retry").textContent = copy.retry;
    const home = document.getElementById("home");
    home.textContent = copy.home;
    home.href = "/" + locale + "/";
    document.getElementById("retry").addEventListener("click", () => location.reload());
</script>
</body>
</html>
