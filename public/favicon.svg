<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
<!-- The tab's mark: the same capital P as the app icon, but the letter alone on
     nothing. A favicon sits on the browser's own chrome rather than on our paper, so a
     tile would only put a coloured box between the letter and whatever the browser is
     painting.

     The letter is ink blue on a light tab and paper on a dark one — a browser that
     honours prefers-color-scheme inside an SVG favicon (Chrome and Firefox do) picks
     the one that can be seen; the ICO beside it is the fallback for those that do not.
     The pink counter is the same either way.

     No width or height: a favicon is rasterised from the viewBox, and the attributes only
     break the mark anywhere it is embedded at a size of its own.

     Cut from the same glyph as public/icon.svg. -->
  <style>
    .letter { fill: #2b4374 }
    @media (prefers-color-scheme: dark) { .letter { fill: #fcf7ea } }
  </style>
  <g transform="translate(11.5 184.0) scale(0.2496 -0.2496)">
    <path class="letter" d="M48 0L48 63L92 70Q111 73 117 82.5Q123 92 123 121L123 589Q123 613 116.5 623Q110 633 89 636L48 642L48 705L349 705Q400 705 443 698.5Q486 692 520.5 677Q555 662 579.5 638.5Q604 615 616.5 580.5Q629 546 629 500Q629 449 613.5 410.5Q598 372 571 344.5Q544 317 510.5 300.5Q477 284 441 276.5Q405 269 372 269Q345 269 322.5 270.5Q300 272 290 274L290 122Q290 95 296.5 84Q303 73 329 70L397 63L397 0Z"/>
    <path d="M334 347Q396 347 427 384.5Q458 422 458 496Q458 544 444 574Q430 604 403 618Q376 632 332 632L290 632L290 350Q298 349 309.5 348Q321 347 334 347Z" fill="#d81b7a"/>
  </g>
</svg>
